name: Construcció Android i comprovacions
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: comprarador-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar els models neuronals locals de PaddleOCR
        shell: bash
        run: |
          set -euo pipefail
          test -f ppocr-sdk/src/main/java/com/paddle/ocr/PaddleOCR.kt
          python tools/prepare_paddleocr.py --models
      - name: Normalitzar els catàlegs originals i executar les proves Python
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_catalog.py --download --allow-rejects
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          informe = json.loads(Path('app/src/main/assets/catalog.report.json').read_text())
          assert informe['integrity'] == 'ok'
          assert informe['products_total'] > 15000
          assert informe['indexed_total'] == informe['products_total']
          print('Referències històriques:', informe['products_total'])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar l'SDK d'Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Provar el parser Kotlin i compilar l'APK de depuració
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar els pesos ONNX dins de l'APK
        shell: bash
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              for name in ('assets/models/det/inference.onnx', 'assets/models/rec/inference.onnx',
                           'assets/models/rec/inference.yml', 'assets/models/model-provenance.json'):
                  assert name in names, f'Manca {name} dins de l\'APK'
                  print(name, z.getinfo(name).file_size, 'bytes')
              provenance = json.loads(z.read('assets/models/model-provenance.json'))
              assert provenance['model'] == 'PP-OCRv6_small'
          print('APK íntegre amb dos models neuronals locals')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Comprarador-v0.1.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Etiquetar i publicar la versió 0.1.5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin refs/tags/v0.1.5 > /dev/null 2>&1; then
            git -c user.name='Arcàdia Lliure' -c user.email='Arcadialliure@outlook.com' tag -a v0.1.5 -m 'Comprarador 0.1.5'
            git push origin refs/tags/v0.1.5
          fi
          if ! gh release view v0.1.5 > /dev/null 2>&1; then
            cp app/build/outputs/apk/debug/app-debug.apk Comprarador-v0.1.5.apk
            gh release create v0.1.5 Comprarador-v0.1.5.apk \
              --title 'Comprarador 0.1.5 · correcció del tiquet SPAR' \
              --notes 'El parser ara tolera imports amb coma separada i «Kg,» en lloc de «Kg.». Prova de regressió amb els vuit articles llegits realment: suma de 13,80 € i patata i préssec associats als seus pesos. El reconeixement del nom comercial encara pot requerir revisió manual. PaddleOCR i els models són locals. APK de depuració: preserveu les dades abans de desinstal·lar.'
          fi
