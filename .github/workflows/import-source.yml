name: Construcció Android i comprovacions
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: comprarador-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidar correcció del fons de la pantalla de compres
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          source_file=app/src/main/java/com/comprarador/app/TopPurchasesActivity.kt
          sed -i 's/setBackgroundColor(background) }/setBackgroundColor(this@TopPurchasesActivity.background) }/' "$source_file"
          git config user.name 'Manel'
          git config user.email 'Arcadialliure@outlook.com'
          git add "$source_file"
          if ! git diff --cached --quiet; then
            git commit -m 'Corregir el color de fons de Top compres'
            git push origin HEAD:main
          fi
      - name: Normalitzar els catàlegs originals i executar les proves
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_catalog.py --download --allow-rejects
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          informe = json.loads(Path('app/src/main/assets/catalog.report.json').read_text())
          assert informe['integrity'] == 'ok'
          assert informe['products_total'] > 15000
          assert informe['indexed_total'] == informe['products_total']
          print('Referències històriques:', informe['products_total'])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar l'SDK d'Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar l'APK de depuració
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Comprarador-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
