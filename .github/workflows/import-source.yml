name: Construcció Android i comprovacions
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: comprarador-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retirar els fitxers temporals i consolidar l'arrel catalana
        if: github.event_name == 'push' && hashFiles('tools/neteja_historial.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          arrel = Path.cwd()
          migracio = arrel / 'tools/neteja_historial.py'
          codi = migracio.read_text(encoding='utf-8')
          marca = "escriu('tests/test_catalog.py', '''"
          assert marca in codi
          exemples = codi.split(marca, 1)[1].split("\n''')", 1)[0]
          (arrel / 'tests/test_catalog.py').write_text(exemples.strip('\n') + '\n', encoding='utf-8')
          activitat = arrel / 'app/src/main/java/com/comprarador/app/MainActivity.kt'
          text = activitat.read_text(encoding='utf-8')
          text = text.replace('fillViewport = true', 'isFillViewport = true')
          text = text.replace('// Suggestions only; never automatically accept a match.', '// Les propostes no es confirmen automàticament.')
          text = text.replace('/** Signature covers the edited OCR text AND every product/match field. */', '/** La signatura inclou el text revisat, els productes i les equivalències. */')
          activitat.write_text(text, encoding='utf-8')
          manifest = arrel / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8').replace('<!-- Prevent transitive dependencies from adding network access. -->', '<!-- Evita que les dependències afegeixin accés a la xarxa. -->')
          manifest.write_text(text, encoding='utf-8')
          demostracio = arrel / 'tools/demo.py'
          text = demostracio.read_text(encoding='utf-8').replace("default='manz golden'", "default='poma golden'")
          demostracio.write_text(text, encoding='utf-8')
          for fitxer in ('neteja_historial.py', 'normalitza_catala.py', 'fix_signed.py'):
              (arrel / 'tools' / fitxer).unlink(missing_ok=True)
          shutil.rmtree(arrel / 'data/demo', ignore_errors=True)
          PY
          python -m py_compile tools/build_catalog.py tools/demo.py tests/test_catalog.py
          python -m unittest discover -s tests -v
          git diff --check
          git checkout --orphan arrel-revisada
          git add -A
          export GIT_AUTHOR_NAME='Manel'
          export GIT_AUTHOR_EMAIL='Arcadialliure@outlook.com'
          export GIT_COMMITTER_NAME='Manel'
          export GIT_COMMITTER_EMAIL='Arcadialliure@outlook.com'
          git commit -m 'Versió inicial de Comprarador'
          git push --force-with-lease="refs/heads/main:${GITHUB_SHA}" origin HEAD:refs/heads/main
          test "$(git rev-list --count HEAD)" -eq 1
          echo 'Historial consolidat en un únic commit inicial atribuït a Manel.'
      - name: Verificar el catàleg i executar les proves
        run: |
          set -euo pipefail
          python tools/build_catalog.py --download --allow-rejects
          python -m unittest discover -s tests -v
          python - <<'PY'
          import json
          from pathlib import Path
          informe=json.loads(Path('app/src/main/assets/catalog.report.json').read_text())
          assert informe['integrity'] == 'ok'
          assert informe['products_total'] > 15000
          assert informe['indexed_total'] == informe['products_total']
          print('Referències històriques:', informe['products_total'])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar l'SDK d'Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar l'APK de depuració
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Comprarador-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
